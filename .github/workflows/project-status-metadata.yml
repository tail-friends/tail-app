name: PR 개발 현황 메타데이터

# 기본 브랜치 main에 승인된 배포가 필요하다. PR head의 코드는 실행하지 않는다.
on:
  pull_request_target:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 확인할 PR 번호
        required: true
        type: string
      apply:
        description: PR 본문 갱신 (기본값은 읽기 전용)
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  metadata:
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(fromJSON('["develop", "main"]'), github.event.pull_request.base.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            project-status/data

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check trusted metadata deployment
        id: deployment
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path.cwd()
          required = (
              '.github/scripts/pr_metadata.py',
              '.github/scripts/project_status.py',
              'project-status/data/designs.json',
              'project-status/data/api-tasks.json',
          )
          ready = all((root / path).is_file() for path in required)
          if ready:
              try:
                  sys.path.insert(0, str(root / '.github/scripts'))
                  import pr_metadata
                  registry = json.loads((root / required[2]).read_text(encoding='utf-8'))
                  catalog = json.loads((root / required[3]).read_text(encoding='utf-8'))
                  result = pr_metadata.plan(
                      {'title': '', 'body': '', 'base': {'ref': 'develop'}},
                      [], [], registry, catalog,
                  )
                  ready = callable(pr_metadata.synchronize) and result['metadata']['work_type'] == 'OTHER'
              except Exception:
                  ready = False
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"ready={str(ready).lower()}\n")
          if not ready:
              message = (
                  'Trusted metadata deployment is not ready on the default branch; '
                  'skipping PR body updates. Deploy the workflow, scripts and registries together.'
              )
              print(message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(message + '\n')
          PY

      - name: Generate or preserve tracking metadata
        if: steps.deployment.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          APPLY: ${{ github.event_name == 'pull_request_target' || inputs.apply }}
        shell: bash
        run: |
          args=(--repository "$GITHUB_REPOSITORY" --pr-number "$PR_NUMBER")
          if [[ "$APPLY" == "true" ]]; then
            args+=(--apply)
          else
            args+=(--dry-run)
          fi
          python .github/scripts/pr_metadata.py "${args[@]}"
