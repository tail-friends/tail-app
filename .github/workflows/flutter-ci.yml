name: Flutter CI

# 모든 PR에서 체크가 생기도록 워크플로는 항상 실행하고,
# Android 관련 파일이 바뀌지 않았으면 verify 잡만 건너뛴다. (건너뛴 잡은 필수 체크에서 통과로 취급된다)
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read

# 같은 브랜치에 새로 push하면 이전 실행은 취소한다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - "android-app/**"
              - "shared/**"
              - ".fvmrc"
              - ".github/workflows/flutter-ci.yml"

  verify:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      # Flutter 버전은 .fvmrc 한 곳에서만 관리한다
      - name: Read Flutter version
        id: fvm
        working-directory: .
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      # android/app/build.gradle.kts가 Java 17을 쓴다. 러너 기본 JDK가 바뀌어도 빌드가 깨지지 않게 고정한다
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # debug APK 빌드의 Gradle 의존성을 캐시한다
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
