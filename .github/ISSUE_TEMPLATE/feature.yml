name: 기능 개발
description: 기능 ID에 따른 새 기능을 제안하거나 구현합니다.
title: "[Feature] "
labels: ["feature"]
body:
  - type: input
    id: feature-id
    attributes:
      label: 기능 ID
      description: 기획서의 기능 ID를 입력해 주세요.
      placeholder: F-01
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
      description: 해결할 사용자 문제와 목표를 작성해 주세요.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 플랫폼
      multiple: true
      options: [Android, iOS, 공통, 백엔드 연계]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 포함 범위와 제외 범위를 구분해 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 검증 가능한 체크리스트로 작성해 주세요.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: 테스트 항목
      description: 단위·Widget·통합·수동 테스트 계획을 작성해 주세요.
      value: "- [ ] "
    validations:
      required: true
